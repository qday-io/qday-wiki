name: Deploy to Cloudflare Pages

# Manual-only until Cloudflare is set up. To enable auto-deploy later:
#   1. add repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#   2. set the real projectName below
#   3. uncomment the push trigger
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Docusaurus)
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: qday-community
          directory: build          # Docusaurus outputs to ./build (was docs/.vitepress/dist)
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main