server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # keep redirects relative + port-safe behind proxies
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Docusaurus emits <route>/index.html. Serve the file directly (no dir
    # redirect that could drop the port), falling back to the 404 page.
    location / {
        try_files $uri $uri/index.html $uri.html /404.html;
    }

    error_page 404 /404.html;
}
